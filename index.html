<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexusPad Pro - Advanced Workspace</title>
    <!-- Google AdSense Account Meta Tag -->
    <meta name="google-adsense-account" content="ca-pub-6062724999261135">
    <!-- Google Search Console Verification Meta Tag -->
    <meta name="google-site-verification" content="PX1GUx4n5IMrOn5YxaKtNA2Q8w2ufkbp3Yto3KL2KlU" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- CryptoJS for Client-Side AES Encryption -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        themeBase: 'var(--bg-base)',
                        themePanel: 'var(--bg-panel)',
                        themeBorder: 'var(--border-color)',
                        themeAccent: 'var(--accent-color)'
                    }
                }
            }
        }
    </script>
    <style>
        :root[data-theme="emerald"] { --bg-base: #030712; --bg-panel: #111827; --border-color: #1f2937; --accent-color: #10b981; }
        :root[data-theme="cyberpunk"] { --bg-base: #05050a; --bg-panel: #0f0f1a; --border-color: #1f1f3a; --accent-color: #f43f5e; }
        :root[data-theme="midnight"] { --bg-base: #090d16; --bg-panel: #101726; --border-color: #1e293b; --accent-color: #6366f1; }
        :root[data-theme="amber"] { --bg-base: #120e0a; --bg-panel: #1c1510; --border-color: #2e2118; --accent-color: #f59e0b; }
        body { background-color: var(--bg-base); color: #f3f4f6; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden font-sans">

    <!-- Top Header -->
    <header class="bg-themePanel border-b border-themeBorder px-3 py-2 flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-1.5">
            <div class="w-2.5 h-2.5 rounded-full" style="background-color: var(--accent-color);"></div>
            <h1 class="font-black tracking-wider text-xs">NEXUS<span style="color: var(--accent-color);">PAD</span></h1>
        </div>
        
        <!-- Header Actions -->
        <div class="flex items-center space-x-1">
            <button onclick="togglePreview()" id="previewBtn" class="px-2 py-1 rounded bg-themeBase text-[11px] font-medium border border-themeBorder transition">Preview</button>
            <button onclick="openStatsModal()" class="px-2 py-1 rounded bg-themeBase text-[11px] font-medium border border-themeBorder">📊 Stats</button>
            <button onclick="openMenu()" class="p-1 rounded bg-themeBase border border-themeBorder">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex relative overflow-hidden">
        <!-- Editor View -->
        <textarea id="notepad" class="w-full h-full bg-themeBase p-4 text-slate-100 text-sm leading-relaxed focus:outline-none resize-none font-mono" placeholder="Type notes or markdown here..."></textarea>
        
        <!-- Markdown Preview View -->
        <div id="previewPane" class="w-full h-full bg-themePanel/40 p-5 overflow-y-auto hidden prose prose-invert max-w-none text-sm"></div>
    </main>

    <!-- Bottom Action Toolbar -->
    <nav class="bg-themePanel border-t border-themeBorder px-1 py-2 flex justify-around items-center shrink-0 text-[10px]">
        <button onclick="createNewNote()" class="flex flex-col items-center text-slate-400 hover:text-slate-100">
            <span class="text-sm mb-0.5">➕</span> New
        </button>
        <button onclick="toggleEncryptNote()" id="lockBtn" class="flex flex-col items-center text-slate-400 hover:text-slate-100">
            <span class="text-sm mb-0.5">🔒</span> Lock
        </button>
        <button onclick="generateShareLink()" class="flex flex-col items-center text-slate-400 hover:text-slate-100">
            <span class="text-sm mb-0.5">🔗</span> Share
        </button>
        <button onclick="exportFile('txt')" class="flex flex-col items-center text-slate-400 hover:text-slate-100">
            <span class="text-sm mb-0.5">📄</span> TXT
        </button>
        <button onclick="exportFile('html')" class="flex flex-col items-center text-slate-400 hover:text-slate-100">
            <span class="text-sm mb-0.5">🌐</span> HTML
        </button>
        <button onclick="clearCurrentNote()" class="flex flex-col items-center text-red-400">
            <span class="text-sm mb-0.5">🗑️</span> Clear
        </button>
    </nav>

    <!-- Slide-out Drawer Menu -->
    <div id="sideMenu" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden transition-opacity">
        <div class="absolute right-0 top-0 bottom-0 w-4/5 max-w-xs bg-themePanel border-l border-themeBorder p-4 flex flex-col">
            <div class="flex justify-between items-center mb-3 border-b border-themeBorder pb-2">
                <h2 class="font-bold text-xs uppercase tracking-wider text-slate-300">Workspace & Settings</h2>
                <button onclick="closeMenu()" class="text-slate-400 text-base">&times;</button>
            </div>
            
            <!-- Theme Selector -->
            <div class="mb-3">
                <span class="text-[10px] text-slate-400 block mb-1">Color Theme</span>
                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="setTheme('emerald')" class="h-6 rounded bg-emerald-500 text-[9px] font-bold text-black">Emerald</button>
                    <button onclick="setTheme('cyberpunk')" class="h-6 rounded bg-rose-500 text-[9px] font-bold text-black">Cyber</button>
                    <button onclick="setTheme('midnight')" class="h-6 rounded bg-indigo-500 text-[9px] font-bold text-white">Midnight</button>
                    <button onclick="setTheme('amber')" class="h-6 rounded bg-amber-500 text-[9px] font-bold text-black">Amber</button>
                </div>
            </div>

            <!-- Extra Utility Features -->
            <div class="mb-3 space-y-2">
                <span class="text-[10px] text-slate-400 block">Text Utilities</span>
                <div class="grid grid-cols-3 gap-1">
                    <button onclick="transformText('upper')" class="bg-themeBase border border-themeBorder rounded py-1 text-[10px] hover:bg-themeBorder">UPPER</button>
                    <button onclick="transformText('lower')" class="bg-themeBase border border-themeBorder rounded py-1 text-[10px] hover:bg-themeBorder">lower</button>
                    <button onclick="openFindReplace()" class="bg-themeBase border border-themeBorder rounded py-1 text-[10px] hover:bg-themeBorder">Find/Replace</button>
                </div>
            </div>

            <div class="text-[10px] text-slate-400 mb-1 flex justify-between items-center">
                <span>Saved Documents</span>
                <span id="docCount" class="text-[9px] text-slate-500"></span>
            </div>
            
            <!-- Saved Notes List with Delete Option -->
            <div id="notesList" class="flex-1 overflow-y-auto space-y-1.5 mb-3 pr-1"></div>

            <!-- AdSense Status Zone -->
            <div class="bg-themeBase border border-themeBorder rounded-lg p-2 text-center">
                <span class="text-[9px] text-slate-500 uppercase tracking-wider block mb-1">Workspace Status</span>
                <div class="h-10 bg-themePanel rounded border border-dashed border-themeBorder flex items-center justify-center text-[10px] text-slate-500">
                    Ready for AdSense
                </div>
            </div>
        </div>
    </div>

    <!-- Analytics Modal -->
    <div id="statsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-themePanel border border-themeBorder rounded-xl p-4 w-full max-w-xs">
            <h3 class="font-bold text-sm mb-3 text-slate-200">Document Analytics</h3>
            <div class="space-y-2 text-xs text-slate-300 mb-4" id="statsContent"></div>
            <button onclick="closeStatsModal()" class="w-full py-1.5 rounded bg-themeBase border border-themeBorder text-xs font-bold">Close</button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let notes = JSON.parse(localStorage.getItem('nexus_v4_notes')) || [
            { id: '1', title: 'Welcome Document', content: '# Welcome to NexusPad Pro\n\n- Delete notes using the trash icon in menu\n- Transform text case instantly\n- Fully secure local storage', password: null }
        ];
        let currentId = notes[0].id;
        let isPreview = false;
        let currentTheme = localStorage.getItem('nexus_theme') || 'emerald';
        setTheme(currentTheme, false);

        const notepad = document.getElementById('notepad');
        const previewPane = document.getElementById('previewPane');

        window.addEventListener('DOMContentLoaded', () => {
            if(window.location.hash.startsWith('#note=')) {
                try {
                    const encodedData = window.location.hash.replace('#note=', '');
                    const decodedText = decodeURIComponent(atob(encodedData));
                    const newId = Date.now().toString();
                    notes.push({ id: newId, title: 'Shared Note', content: decodedText, password: null });
                    currentId = newId;
                    saveNotes();
                    window.location.hash = '';
                } catch(e) { console.error("Failed to parse shared note"); }
            }
            loadNote();
        });

        function loadNote() {
            const note = notes.find(n => n.id === currentId);
            if (!note) {
                if(notes.length > 0) { currentId = notes[0].id; loadNote(); }
                return;
            }
            if (note.password) {
                const pass = prompt("This note is encrypted. Enter password:");
                try {
                    const bytes = CryptoJS.AES.decrypt(note.content, pass);
                    notepad.value = bytes.toString(CryptoJS.enc.Utf8) || "Decryption failed.";
                } catch(e) { notepad.value = "Error unlocking note."; }
            } else {
                notepad.value = note.content;
            }
            updateLockBtnState();
        }

        notepad.addEventListener('input', () => {
            const note = notes.find(n => n.id === currentId);
            if (note && !note.password) {
                note.content = notepad.value;
                const firstLine = notepad.value.split('\n')[0].trim();
                note.title = firstLine ? firstLine.substring(0, 18) + (firstLine.length > 18 ? '...' : '') : 'Untitled';
                saveNotes();
            }
        });

        function saveNotes() { localStorage.setItem('nexus_v4_notes', JSON.stringify(notes)); }

        function togglePreview() {
            isPreview = !isPreview;
            const btn = document.getElementById('previewBtn');
            if (isPreview) {
                btn.style.backgroundColor = 'var(--accent-color)';
                btn.style.color = '#000';
                previewPane.innerHTML = marked.parse(notepad.value);
                notepad.classList.add('hidden');
                previewPane.classList.remove('hidden');
            } else {
                btn.style.backgroundColor = '';
                btn.style.color = '';
                notepad.classList.remove('hidden');
                previewPane.classList.add('hidden');
            }
        }

        function setTheme(themeName, save=true) {
            currentTheme = themeName;
            document.documentElement.setAttribute('data-theme', themeName);
            if(save) localStorage.setItem('nexus_theme', themeName);
        }

        function toggleEncryptNote() {
            const note = notes.find(n => n.id === currentId);
            if(note.password) {
                if(confirm("Remove password protection?")) {
                    const pass = prompt("Enter current password:");
                    try {
                        const bytes = CryptoJS.AES.decrypt(note.content, pass);
                        note.content = bytes.toString(CryptoJS.enc.Utf8);
                        note.password = null;
                        saveNotes();
                        alert("Note decrypted!");
                    } catch(e) { alert("Incorrect password!"); }
                }
            } else {
                const pass = prompt("Set a password to encrypt this note locally:");
                if(pass) {
                    note.content = CryptoJS.AES.encrypt(notepad.value, pass).toString();
                    note.password = true;
                    saveNotes();
                    alert("Note encrypted securely!");
                }
            }
            updateLockBtnState();
        }

        function updateLockBtnState() {
            const note = notes.find(n => n.id === currentId);
            const btn = document.getElementById('lockBtn');
            btn.style.color = note?.password ? 'var(--accent-color)' : '';
        }

        function generateShareLink() {
            const note = notes.find(n => n.id === currentId);
            if(note.password) { alert("Cannot share encrypted notes via link."); return; }
            const encoded = btoa(encodeURIComponent(notepad.value));
            const shareUrl = `${window.location.origin}${window.location.pathname}#note=${encoded}`;
            navigator.clipboard.writeText(shareUrl);
            alert("Shareable link copied to clipboard!");
        }

        function exportFile(type) {
            let blob, filename;
            if(type === 'txt') {
                blob = new Blob([notepad.value], { type: 'text/plain' });
                filename = 'note.txt';
            } else {
                const htmlContent = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Note</title></head><body style="font-family:sans-serif;padding:2rem;max-width:800px;margin:auto;">${marked.parse(notepad.value)}</body></html>`;
                blob = new Blob([htmlContent], { type: 'text/html' });
                filename = 'note.html';
            }
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
        }

        function transformText(type) {
            if(type === 'upper') notepad.value = notepad.value.toUpperCase();
            if(type === 'lower') notepad.value = notepad.value.toLowerCase();
            notepad.dispatchEvent(new Event('input'));
        }

        function openFindReplace() {
            const target = prompt("Find what text?");
            if(!target) return;
            const replacement = prompt("Replace with what?");
            if(replacement === null) return;
            notepad.value = notepad.value.replaceAll(target, replacement);
            notepad.dispatchEvent(new Event('input'));
            alert("Replaced successfully!");
        }

        function openStatsModal() {
            const text = notepad.value;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            const readingTime = Math.ceil(words / 200);
            
            document.getElementById('statsContent').innerHTML = `
                <div class="flex justify-between border-b border-themeBorder pb-1"><span>Word Count:</span> <strong>${words}</strong></div>
                <div class="flex justify-between border-b border-themeBorder pb-1"><span>Character Count:</span> <strong>${chars}</strong></div>
                <div class="flex justify-between"><span>Est. Reading Time:</span> <strong>${readingTime} min(s)</strong></div>
            `;
            document.getElementById('statsModal').classList.remove('hidden');
        }
        function closeStatsModal() { document.getElementById('statsModal').classList.add('hidden'); }

        function openMenu() {
            const list = document.getElementById('notesList');
            document.getElementById('docCount').innerText = `${notes.length} saved`;
            list.innerHTML = '';
            
            notes.forEach(n => {
                const item = document.createElement('div');
                item.className = `p-2 rounded text-xs cursor-pointer flex justify-between items-center ${n.id === currentId ? 'bg-themeBase font-bold border border-themeBorder' : 'text-slate-400 bg-themePanel/60 hover:bg-themeBase'}`;
                
                const titleSpan = document.createElement('span');
                titleSpan.className = "truncate flex-1";
                titleSpan.innerText = `${n.title} ${n.password ? '🔒' : ''}`;
                titleSpan.onclick = () => { currentId = n.id; loadNote(); closeMenu(); };
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = "text-slate-500 hover:text-red-400 p-1 ml-2 text-sm";
                deleteBtn.innerHTML = "🗑️";
                deleteBtn.onclick = (e) => { e.stopPropagation(); deleteNote(n.id); };

                item.appendChild(titleSpan);
                item.appendChild(deleteBtn);
                list.appendChild(item);
            });
            document.getElementById('sideMenu').classList.remove('hidden');
        }

        function deleteNote(id) {
            if(notes.length <= 1) { alert("You must keep at least one note!"); return; }
            if(confirm("Are you sure you want to delete this note?")) {
                notes = notes.filter(n => n.id !== id);
                saveNotes();
                if(currentId === id) { currentId = notes[0].id; loadNote(); }
                openMenu(); // refresh drawer list
            }
        }

        function closeMenu() { document.getElementById('sideMenu').classList.add('hidden'); }
        
        function createNewNote() {
            const id = Date.now().toString();
            notes.push({ id, title: 'New Note', content: 'Start typing...', password: null });
            currentId = id;
            saveNotes();
            loadNote();
            closeMenu();
        }

        function clearCurrentNote() {
            if(confirm('Clear current note content?')) { notepad.value = ''; notepad.dispatchEvent(new Event('input')); }
        }
    </script>
</body>
                    </html>

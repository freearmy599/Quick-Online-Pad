<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexusPad - Minimalist Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden font-sans">

    <!-- Sleek Top Header -->
    <header class="bg-slate-900/80 backdrop-blur border-b border-slate-800 px-4 py-3 flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-2">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <h1 class="font-bold tracking-wider text-sm bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">NEXUSPAD</h1>
        </div>
        
        <!-- Minimalist Actions -->
        <div class="flex items-center space-x-1">
            <button onclick="togglePreview()" id="previewBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-medium border border-slate-700 active:scale-95 transition">Preview</button>
            <button onclick="openMenu()" class="p-1.5 rounded-lg bg-slate-800 text-slate-300 border border-slate-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        <!-- Editor View -->
        <textarea id="notepad" class="w-full h-full bg-slate-950 p-4 text-slate-100 text-base leading-relaxed focus:outline-none resize-none font-mono" placeholder="Type your notes here..."></textarea>
        
        <!-- Preview View -->
        <div id="previewPane" class="w-full h-full bg-slate-900 p-5 overflow-y-auto hidden prose prose-invert max-w-none text-sm"></div>
    </main>

    <!-- Bottom Action Toolbar -->
    <nav class="bg-slate-900 border-t border-slate-800 px-4 py-2.5 flex justify-around items-center shrink-0">
        <button onclick="createNewNote()" class="flex flex-col items-center text-slate-400 hover:text-emerald-400 text-[10px] font-medium">
            <span class="text-lg mb-0.5">➕</span> New
        </button>
        <button onclick="copyToClipboard()" class="flex flex-col items-center text-slate-400 hover:text-cyan-400 text-[10px] font-medium">
            <span class="text-lg mb-0.5">📋</span> Copy
        </button>
        <button onclick="downloadNote()" class="flex flex-col items-center text-slate-400 hover:text-indigo-400 text-[10px] font-medium">
            <span class="text-lg mb-0.5">📥</span> Export
        </button>
        <button onclick="clearCurrentNote()" class="flex flex-col items-center text-slate-400 hover:text-red-400 text-[10px] font-medium">
            <span class="text-lg mb-0.5">🗑️</span> Clear
        </button>
    </nav>

    <!-- Slide-out Menu for Notes Management & Ads -->
    <div id="sideMenu" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden transition-opacity">
        <div class="absolute right-0 top-0 bottom-0 w-4/5 max-w-xs bg-slate-900 border-l border-slate-800 p-4 flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                <h2 class="font-bold text-sm text-slate-200">Your Documents</h2>
                <button onclick="closeMenu()" class="text-slate-400 text-lg">&times;</button>
            </div>
            
            <div id="notesList" class="flex-1 overflow-y-auto space-y-2 mb-4">
                <!-- Notes injected dynamically -->
            </div>

            <!-- Monetag Ad Placement Box -->
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-center">
                <span class="text-[9px] text-slate-500 uppercase tracking-wider block mb-1">Sponsored</span>
                <!-- PASTE YOUR MONETAG MULTITAG SCRIPT INSIDE OR BELOW -->
                <div class="h-16 bg-slate-900/50 rounded border border-dashed border-slate-800 flex items-center justify-center text-[10px] text-slate-500">
                    Ad Unit Zone
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let notes = JSON.parse(localStorage.getItem('nexus_v2_notes')) || [
            { id: '1', title: 'Welcome Note', content: '# Welcome to NexusPad\n\n- Clean minimalist layout\n- Tap bottom bar for actions\n- Open menu for saved notes' }
        ];
        let currentId = notes[0].id;
        let isPreview = false;

        const notepad = document.getElementById('notepad');
        const previewPane = document.getElementById('previewPane');

        function loadNote() {
            const note = notes.find(n => n.id === currentId);
            if (note) notepad.value = note.content;
        }

        notepad.addEventListener('input', () => {
            const note = notes.find(n => n.id === currentId);
            if (note) {
                note.content = notepad.value;
                const firstLine = notepad.value.split('\n')[0].trim();
                note.title = firstLine ? firstLine.substring(0, 18) + (firstLine.length > 18 ? '...' : '') : 'Untitled Note';
                localStorage.setItem('nexus_v2_notes', JSON.stringify(notes));
            }
        });

        function togglePreview() {
            isPreview = !isPreview;
            const btn = document.getElementById('previewBtn');
            if (isPreview) {
                btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');
                previewPane.innerHTML = marked.parse(notepad.value);
                notepad.classList.add('hidden');
                previewPane.classList.remove('hidden');
            } else {
                btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-500');
                notepad.classList.remove('hidden');
                previewPane.classList.add('hidden');
            }
        }

        function openMenu() {
            const list = document.getElementById('notesList');
            list.innerHTML = '';
            notes.forEach(n => {
                const item = document.createElement('div');
                item.className = `p-2.5 rounded-lg text-xs cursor-pointer flex justify-between items-center ${n.id === currentId ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : 'bg-slate-950 text-slate-300'}`;
                item.innerHTML = `<span>${n.title}</span>`;
                item.onclick = () => { currentId = n.id; loadNote(); closeMenu(); };
                list.appendChild(item);
            });
            document.getElementById('sideMenu').classList.remove('hidden');
        }

        function closeMenu() { document.getElementById('sideMenu').classList.add('hidden'); }
        function createNewNote() {
            const id = Date.now().toString();
            notes.push({ id, title: 'New Note', content: 'Start writing...' });
            currentId = id;
            localStorage.setItem('nexus_v2_notes', JSON.stringify(notes));
            loadNote();
        }
        function copyToClipboard() { navigator.clipboard.writeText(notepad.value); alert('Copied!'); }
        function downloadNote() {
            const blob = new Blob([notepad.value], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'note.txt';
            a.click();
        }
        function clearCurrentNote() {
            if(confirm('Clear this note?')) { notepad.value = ''; notepad.dispatchEvent(new Event('input')); }
        }

        loadNote();
    </script>
</body>
</html>
